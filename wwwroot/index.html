<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Tidal Now Playing</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  #card {
    display: flex;
    align-items: center;
    gap: 16px;
    width: 480px;
    padding: 14px;
    background: rgba(10, 10, 14, 0.78);
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    color: #fff;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.4s ease, transform 0.4s ease;
    box-sizing: border-box;
  }

  #card.visible {
    opacity: 1;
    transform: translateY(0);
  }

  #art {
    width: 64px;
    height: 64px;
    border-radius: 10px;
    object-fit: cover;
    background: #1c1c22 linear-gradient(135deg, #0ff0c8, #0a0a0e);
    flex-shrink: 0;
  }

  #info {
    flex: 1;
    min-width: 0;
  }

  #title {
    font-size: 16px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #artist {
    font-size: 13px;
    color: #b9b9c3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }

  #progress-track {
    margin-top: 8px;
    height: 4px;
    width: 100%;
    background: rgba(255,255,255,0.15);
    border-radius: 2px;
    overflow: hidden;
  }

  #progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #00ffe0, #00c2ff);
  }

  #time-remaining {
    margin-top: 4px;
    font-size: 11px;
    color: #b9b9c3;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  #eq {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 20px;
    flex-shrink: 0;
  }

  #eq span {
    display: block;
    width: 4px;
    background: #00ffe0;
    border-radius: 2px;
    animation: bounce 1s infinite ease-in-out;
  }

  #eq span:nth-child(1) { animation-delay: 0s; }
  #eq span:nth-child(2) { animation-delay: 0.2s; }
  #eq span:nth-child(3) { animation-delay: 0.4s; }
  #eq span:nth-child(4) { animation-delay: 0.6s; }

  @keyframes bounce {
    0%, 100% { height: 4px; }
    50% { height: 18px; }
  }

  .paused #eq span {
    animation-play-state: paused;
    height: 4px;
  }
</style>
</head>
<body>

<div id="card">
  <img id="art" src="" alt="" />
  <div id="info">
    <div id="title">—</div>
    <div id="artist">—</div>
    <div id="progress-track"><div id="progress-bar"></div></div>
    <div id="time-remaining">-0:00</div>
  </div>
  <div id="eq"><span></span><span></span><span></span><span></span></div>
</div>

<script>
  const card = document.getElementById('card');
  const artEl = document.getElementById('art');
  const titleEl = document.getElementById('title');
  const artistEl = document.getElementById('artist');
  const progressBar = document.getElementById('progress-bar');
  const timeRemainingEl = document.getElementById('time-remaining');

  let lastKey = '';
  let serverPosition = 0;
  let serverDuration = 0;
  let serverIsPlaying = false;
  let serverSyncedAt = 0; // performance.now() au moment du dernier poll

  async function poll() {
    try {
      const res = await fetch('/now-playing.json', { cache: 'no-store' });
      const data = await res.json();

      if (!data.hasTrack) {
        card.classList.remove('visible');
        lastKey = '';
        setTimeout(poll, 1500);
        return;
      }

      card.classList.add('visible');
      card.classList.toggle('paused', !data.isPlaying);

      titleEl.textContent = data.title || '—';
      artistEl.textContent = data.artist || '—';

      const key = data.artist + '::' + data.title + '::' + data.album;
      if (key !== lastKey) {
        lastKey = key;
        artEl.src = data.hasArt ? ('/art?t=' + Date.now()) : '';
      }

      serverPosition = data.positionSeconds || 0;
      serverDuration = data.durationSeconds || 0;
      serverIsPlaying = data.isPlaying;
      serverSyncedAt = performance.now();
    } catch (e) {
      // serveur pas encore prêt, on réessaie
    }
    setTimeout(poll, 1000);
  }

  function formatTime(totalSeconds) {
    const s = Math.max(0, Math.round(totalSeconds));
    const minutes = Math.floor(s / 60);
    const seconds = s % 60;
    return minutes + ':' + String(seconds).padStart(2, '0');
  }

  function renderProgress() {
    if (serverDuration > 0) {
      let position = serverPosition;
      if (serverIsPlaying) {
        position += (performance.now() - serverSyncedAt) / 1000;
      }
      position = Math.min(position, serverDuration);
      const pct = Math.min(100, (position / serverDuration) * 100);
      progressBar.style.width = pct + '%';
      timeRemainingEl.textContent = '-' + formatTime(serverDuration - position);
    } else {
      progressBar.style.width = '0%';
      timeRemainingEl.textContent = '';
    }
    requestAnimationFrame(renderProgress);
  }

  poll();
  renderProgress();
</script>

</body>
</html>
