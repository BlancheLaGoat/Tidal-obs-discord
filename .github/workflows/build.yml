name: Build Windows executable

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # permet aussi de le lancer manuellement depuis l'onglet Actions

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurer les dépendances
        run: dotnet restore TidalNowPlaying.csproj

      # --self-contained true + PublishSingleFile regroupe tout (runtime .NET,
      # dépendances, wwwroot) en un seul .exe autonome. Pas besoin d'installer
      # quoi que ce soit sur la machine de destination.
      - name: Compiler (Release, win-x64, fichier unique)
        run: >
          dotnet publish TidalNowPlaying.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeAllContentForSelfExtract=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishReadyToRun=false
          -p:DebugType=None
          -o publish

      - name: Publier le résultat (téléchargeable depuis cet onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: TidalNowPlaying
          path: publish/TidalNowPlaying.exe
          retention-days: 90
